services:
  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: password
      MARIADB_DATABASE: image_repo
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-uroot", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: quay.io/minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    depends_on:
      mariadb:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3100
      DATABASE_URL: mysql://root:password@mariadb:3306/image_repo
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: password
      DB_NAME: image_repo
      STORAGE_PROVIDER: minio
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: image-annotations
      MAX_UPLOAD_SIZE_BYTES: 5242880
      # Vistas de calidad: el portal lee lo que escribe el pipeline de DVC
      # (reports/) y Settings edita la misma politica que lee dvc.yaml.
      # QUALITY_REPORTS_DIR y QUALITY_CONFIG_FILE solo se cambian en `make demo`,
      # que apunta a los artefactos y a la politica del dataset sintetico.
      QUALITY_ARTIFACTS_DIR: /artifacts
      QUALITY_CONFIG_PATH: /config/quality.yaml
      # Dataset Copilot: se leen del .env de la raiz. Sin clave responde en modo anclado.
      COPILOT_PROVIDER: ${COPILOT_PROVIDER:-none}
      COPILOT_API_KEY: ${COPILOT_API_KEY:-}
      COPILOT_MODEL: ${COPILOT_MODEL:-}
    volumes:
      - ${QUALITY_REPORTS_DIR:-./reports}:/artifacts:ro
      - ${QUALITY_CONFIG_FILE:-./quality/quality.yaml}:/config/quality.yaml
    ports:
      - "3100:3100"
    # La imagen del backend no trae curl ni wget; node si tiene fetch.
    # start_period cubre migraciones + seed del entrypoint.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3100/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: on-failure:5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  mariadb_data:
  minio_data:
