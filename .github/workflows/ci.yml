name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  quality:
    name: Ruff y pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar el paquete de calidad
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4

      - name: Autenticar en AWS por OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: us-east-2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.3

      - name: Tomar el tag de la imagen desplegada
        run: |
          TAG=$(aws ecs describe-task-definition \
            --task-definition proyecto2-prod-backend \
            --query 'taskDefinition.containerDefinitions[?name==`backend`].image | [0]' \
            --output text | awk -F: '{print $NF}')
          echo "Tag desplegado: $TAG"
          echo "TF_VAR_container_image_tag=$TAG" >> "$GITHUB_ENV"

      - name: Init
        run: terraform init -backend-config=backend.hcl.example

      - name: Format
        run: terraform fmt -check -recursive

      - name: Validate
        run: terraform validate

      - name: Plan
        run: terraform plan -no-color
